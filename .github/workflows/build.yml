name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Debug APK derle
        run: gradle assembleDebug
      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk DesteX.apk
      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son --yes --cleanup-tag || true
          gh release create son DesteX.apk --title "DesteX son sürüm" --notes "Otomatik derlenen APK" --target "${{ github.sha }}"
